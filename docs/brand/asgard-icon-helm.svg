<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a48"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset=".55" stop-color="#aab6c8"/><stop offset="1" stop-color="#66738a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#b07a22"/></linearGradient>
  <linearGradient id="hornL" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cdbb94"/><stop offset=".6" stop-color="#efe3c6"/><stop offset="1" stop-color="#fbf6ea"/></linearGradient>
  <linearGradient id="hornR" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#cdbb94"/><stop offset=".6" stop-color="#efe3c6"/><stop offset="1" stop-color="#fbf6ea"/></linearGradient>
  <clipPath id="dome"><path d="M160 300 C160 206 202 162 256 162 C310 162 352 206 352 300z"/></clipPath>
 </defs>
 <rect width="512" height="512" fill="url(#bg)"/>
 <g transform="translate(0 -26)">
 <!-- horns: their bases run under the dome -->
 <path d="M206 262 C168 262 132 238 116 196 C106 168 108 136 118 108 C124 150 142 186 176 206 C190 214 204 218 214 220z" fill="url(#hornL)"/>
 <path d="M306 262 C344 262 380 238 396 196 C406 168 404 136 394 108 C388 150 370 186 336 206 C322 214 308 218 298 220z" fill="url(#hornR)"/>
