 <!-- rim -->
 <rect x="150" y="296" width="212" height="36" rx="8" fill="url(#gold)"/>
 <g fill="#2a3550"><circle cx="186" cy="314" r="5.5"/><circle cx="220" cy="314" r="5.5"/><circle cx="292" cy="314" r="5.5"/><circle cx="326" cy="314" r="5.5"/></g>
 </g>
